envs:
  t2bench:
    kind: benchmark
    title: Current t2bench evaluation tasks
    splits: [base]
    intro:
    - Official Retail / Airline / Telecom base evaluation tasks only; no training data.
    - Base differs from official test. This revision includes tau3 updates; see dataset/manifest.json for versions and digests.
    - task_json contains private user scenarios, initial state and grading data, not an agent prompt.
    - Runtime still requires official policy, tools, databases and an independent user simulator.
    - Examples read Parquet without model inference or hidden-task prompt-length computation.
  gsm8k:
    title: GSM8K evaluation data, redacted examples and public-input lengths
    splits:
    - train
    - test
    thresholds:
    - 512
    - 1024
    intro:
    - data/gsm8k/dataset is evaluation-only. Retained train/test split names do not permit training or tuning.
    - Questions and answers are recovered losslessly from local data/gsm8k/source/{train,test}.parquet, retaining original files and digests.
    - Provenance is recovered_from_local_preprocessed; official native artifact/revision identity is unverified.
    - The six-column transport is unchanged. Public prompts contain questions only; answers and grading fields remain private.
    - Examples redact train row 0 using an allowlist. The selected tokenizer measures lengths without inference or environment resets.
  codegym:
    title: CodeGym shared data, redacted examples and public-input lengths
    splits:
    - train
    - test
    thresholds:
    - 512
    - 1024
    - 4096
    intro:
    - GRPO-ReAct and Dyad share one dataset with identical tasks, prompts and reward fields. No agent_name is stored; runtime selects the loop.
    - Source is VanishD/CodeGym reproduction, not claimed as official paper data. The source has train only; local test is the fixed last 1024 records.
    - Public prompts retain source system function declarations and the complete first user instruction. Runtime adds the FunctionCall protocol.
    - Complete task/environment shards live in dataset/source; dataset/envs/codegym_v1 retains required runtime source.
    - Train-row-0 examples omit answers, trajectories, ability and env_str; no inference or environment reset runs.
  webshop:
    title: WebShop full shared data examples and prompt lengths
    splits: [train, dev, test]
    thresholds: [1024, 2048]
    intro:
    - Official full human tasks preserve goal order with test [0,500), dev [500,1500), train [1500,N), without reshuffling.
    - GRPO-ReAct and Dyad share real backend reset observations and ReAct prompts, excluding agent_name and hidden answers.
    - Training uses train/dev and independent evaluation uses test. Preserve official reward 0..1 and report full success separately.
    - Examples use the first train record. index is split-local; task_id retains the official goal index.
  alfworld:
    title: ALFWorld shared data, redacted examples and public-input lengths
    splits:
    - train
    - test
    - test_unseen
    thresholds:
    - 1024
    - 1408
    intro:
    - GRPO-ReAct and Dyad share one dataset with identical tasks, prompts and reward fields. No agent_name is stored; runtime selects the loop.
    - Sources are mapping-selected json_2.1.1 task assets, retaining traj_data.json, game.tw-pddl, initial_state.pddl, optional receps.json and shared logic/mappings.
    - dataset/source retains assets and digests. Local integrity checks do not establish official release-byte provenance.
    - test/test_full use valid_seen and test_unseen uses valid_unseen. Public input excludes local role/response templates.
    - Redacted train-row-0 examples omit oracle, walkthrough and private reset fields without fabricating observations.
    - Live task descriptions, observations and available actions come from real reset/step calls; open/closed arguments share one protocol.
